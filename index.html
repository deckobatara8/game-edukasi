<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest - Game Edukasi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <h1>🎮 EduQuest</h1>
      <p>Petualangan Belajar Interaktif</p>
    </header>

    <!-- LOGIN -->
    <section id="startScreen" class="card">
      <h2>Selamat Datang!</h2>
      <p>Masukkan nama untuk memulai permainan.</p>

      <input
        type="text"
        id="playerName"
        placeholder="Nama pemain"
        maxlength="30"
      >

      <button onclick="startGame()">Mulai Game 🚀</button>
    </section>

    <!-- GAME -->
    <section id="gameScreen" class="hidden">

      <div class="stats">
        <div>👤 <span id="nameDisplay">-</span></div>
        <div>⭐ Skor: <span id="score">0</span></div>
        <div>❤️ Nyawa: <span id="lives">3</span></div>
        <div>📚 Level: <span id="level">1</span></div>
      </div>

      <!-- AREA GAME -->
      <div id="gameArea">
        <div id="player">🧑‍🎓</div>

        <div class="object object1" onclick="showQuestion()">📦</div>
        <div class="object object2" onclick="showQuestion()">📚</div>
        <div class="object object3" onclick="showQuestion()">💡</div>
      </div>

      <p class="instruction">
        Klik objek untuk menemukan pertanyaan!
      </p>

    </section>

    <!-- QUIZ -->
    <div id="quizModal" class="modal hidden">

      <div class="quizBox">

        <h2>🧠 Pertanyaan</h2>

        <p id="questionText"></p>

        <div id="answers"></div>

        <p id="feedback"></p>

        <button id="nextButton" class="hidden" onclick="closeQuestion()">
          Lanjut ➡️
        </button>

      </div>

    </div>

    <!-- RESULT -->
    <section id="resultScreen" class="card hidden">

      <h2>🎉 Permainan Selesai!</h2>

      <p>Nama: <b id="resultName"></b></p>

      <p>Skor akhir:</p>

      <div class="finalScore" id="finalScore">0</div>

      <p id="resultMessage"></p>

      <button onclick="location.reload()">
        🔄 Main Lagi
      </button>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
